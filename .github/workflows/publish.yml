name: publish-package

on:
  workflow_dispatch:

jobs:
  publish-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MOON_WORK: off
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: install-ubuntu
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: prepublish check
        run: |
          moon check
          moon test

      - name: publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "Error: MOONCAKES_MOONBITLANG_TOKEN secret is not set."
            echo "Please contact an admin to grant access to this secret."
            exit 1
          fi
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json

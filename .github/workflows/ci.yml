name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moon-gates:
    runs-on: ${{ matrix.os }}
    # Nightly toolchain breakage is advance warning, not a gate: it must not
    # block a PR that is green on stable.
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux would have caught the platform-dependent doc snapshot that
        # instead surfaced at publish time; macOS keeps the other side of
        # platform-sensitive behavior (ExtUri case bias, font defaults) honest.
        os: [ubuntu-latest, macos-latest]
        # `latest` is the install script's stable default; `nightly` is its
        # named channel (unix.sh takes the channel as a positional argument).
        channel: [stable, nightly]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: install moon (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "nightly" ]; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The check and test gates docs/quality.md names, spelled out so this
      # job does not need just installed. Runs at the workspace root, so the
      # native server member is covered too.
      - name: check
        run: |
          moon check --target all --warn-list +73
          moon fmt --check

      - name: test
        run: moon test --target all

  # The browser-correctness gate (`just test-browser-smoke`). It exercises the
  # asset pipeline and the Playwright suites end to end — the layer where a
  # justfile/serve/config drift is invisible to moon check and moon test.
  # One platform and channel is enough: this gate tests DOM behavior, not
  # toolchains. It runs on macOS because the suites assert font-dependent
  # geometry (selection rectangles, DOM-measured metrics) that is maintained
  # green against macOS font defaults; on ubuntu 16 of them fail on font
  # differences alone. The perf profile stays out of CI; it is an opt-in
  # diagnostic and needs the heavyweight VS Code submodule.
  browser-correctness:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The Playwright webServer command and the smoke recipe both go through
      # just, so this job installs it (the moon-gates job deliberately does
      # not need it).
      - name: install just
        run: brew install just

      - name: install playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: browser smoke suite
        run: just test-browser-smoke

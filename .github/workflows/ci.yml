name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moon-gates:
    runs-on: ${{ matrix.os }}
    # Nightly toolchain breakage is advance warning, not a gate: it must not
    # block a PR that is green on stable.
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux would have caught the platform-dependent doc snapshot that
        # instead surfaced at publish time; macOS keeps the other side of
        # platform-sensitive behavior (ExtUri case bias, font defaults) honest.
        os: [ubuntu-latest, macos-latest]
        # `latest` is the install script's stable default; `nightly` is its
        # named channel (unix.sh takes the channel as a positional argument).
        channel: [stable, nightly]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: install moon (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "nightly" ]; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The same gates docs/quality.md names as `just check` + `just test`,
      # spelled out so CI does not need just installed. Runs at the workspace
      # root, so the native server member is covered too.
      - name: check
        run: |
          moon check --target all --warn-list +73
          moon fmt --check

      - name: test
        run: moon test --target all
